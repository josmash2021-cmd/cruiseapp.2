name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # ── Flutter analysis ──────────────────────────────────────────────
  flutter:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.10'
          channel: 'stable'

      - name: Check Flutter version
        run: |
          flutter --version
          dart --version

      - name: Create env.dart for CI
        run: |
          mkdir -p lib/config
          cat > lib/config/env.dart << 'EOF'
          /// Environment variables for CI builds.
          /// Real values are injected at deploy time via Codemagic.
          class Env {
            static const String apiKey = '';
            static const String hmacSecret = '';
            static const String mapsServicesKey = '';
            static const String emailjsServiceId = '';
            static const String emailjsTemplateId = '';
            static const String emailjsPublicKey = '';
            static const String emailjsPrivateKey = '';
            static const String stripePublishableKey = '';
            static const String stripeMerchantId = 'merchant.com.cruise.app';
            static const String twilioAccountSid = '';
            static const String twilioAuthToken = '';
            static const String twilioServiceSid = '';
            static const bool paypalSandbox = false;
            static const String paypalClientId = 'PLACEHOLDER_PAYPAL_CLIENT_ID';
            static const String paypalSecret = 'PLACEHOLDER_PAYPAL_SECRET';
          }
          EOF

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze Flutter code
        run: flutter analyze --fatal-infos

      - name: Run Flutter tests
        run: flutter test

  # ── Backend tests ─────────────────────────────────────────────────
  backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run backend tests
        working-directory: ./backend
        run: pytest tests/ -v --tb=short

      - name: Lint backend with ruff
        working-directory: ./backend
        run: |
          pip install ruff
          ruff check .

      - name: Type-check backend with mypy
        working-directory: ./backend
        run: |
          pip install mypy
          mypy . --ignore-missing-imports --warn-return-any
