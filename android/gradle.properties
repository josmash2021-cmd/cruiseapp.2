# Tuned for an 8 GB build machine.
#
# Heap history: 6144m died with "OutOfMemoryError: Java heap space" seven
# minutes into bundleRelease — but that was R8 WITH the optimize passes.
# 5120m without optimize does not crash, it GC-thrashes instead (R8 pinned
# at the heap ceiling; the AAB step crawled past 60 min, build #23).
# 6144m + proguard-android.txt (no optimize) is the middle point: R8's
# peak fits, the GC stops spinning, and macOS swaps the slack instead of
# the JVM starving.
org.gradle.jvmargs=-Xmx6144m -XX:MaxMetaspaceSize=768m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.daemon=false
org.gradle.parallel=false
# One worker, not two: with minify on, a second worker JVM is RAM the R8
# worker needs (OOM "Java heap space" ~21 min into bundleRelease, 2026-09-05).
org.gradle.workers.max=1
# Kotlin compiles in the Gradle JVM instead of spawning its own daemon —
# one less JVM splitting the same 8 GB.
kotlin.compiler.execution.strategy=in-process

# R8's full mode does whole-program optimisation and holds far more of the
# program in memory at once. The build DOES minify now (Play's obfuscation
# threshold), but compat mode obfuscates and shrinks the same — full mode
# only buys extra optimisations the 8 GB builder cannot pay for.
android.enableR8.fullMode=false

android.useAndroidX=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
