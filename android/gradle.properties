# Tuned for an 8 GB build machine.
#
# This used to say -Xmx6144m, which was fine on Codemagic's linux_x2 (32 GB)
# and is not fine on mac_mini_m2 (8 GB). R8 grew into the 6 GB ceiling and
# died with "java.lang.OutOfMemoryError: Java heap space" seven minutes into
# bundleRelease.
#
# 5 GB for the JVM leaves roughly 3 GB for the OS, the Kotlin daemon and
# R8's native side. The daemon is off and workers are capped for the same
# reason: on this machine the scarce resource is memory, not cores, and a
# second Gradle worker is another JVM competing for the same 8 GB.
org.gradle.jvmargs=-Xmx5120m -XX:MaxMetaspaceSize=768m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.daemon=false
org.gradle.parallel=false
org.gradle.workers.max=2

# R8's full mode does whole-program optimisation and holds far more of the
# program in memory at once. The build DOES minify now (Play's obfuscation
# threshold), but compat mode obfuscates and shrinks the same — full mode
# only buys extra optimisations the 8 GB builder cannot pay for.
android.enableR8.fullMode=false

android.useAndroidX=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
