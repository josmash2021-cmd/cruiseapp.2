# ══════════════════════════════════════════════════════════════════════════════
# CruiseinRide — Codemagic CI/CD
# ══════════════════════════════════════════════════════════════════════════════
#
# REQUIRED encrypted variables (add in Codemagic UI → Team settings → Global variables):
#   ENV_MAPBOX_TOKEN       — Mapbox secret access token (sk.eyJ1…) for SDK download
#   CM_KEYSTORE            — Base64-encoded release .jks / .keystore file
#   CM_KEYSTORE_PASSWORD   — Keystore password
#   CM_KEY_ALIAS           — Key alias
#   CM_KEY_PASSWORD        — Key password
#
# The App Store Connect integration "CruiseinRide" must be configured in
# Codemagic UI → Integrations → App Store Connect.
# ══════════════════════════════════════════════════════════════════════════════

definitions:
  # ── Shared environment variables ─────────────────────────────────────────
  # ALL secrets are stored as ENCRYPTED variables in Codemagic UI:
  #   Team settings → Global variables & secrets → Group: "cruise_secrets"
  #
  # Required encrypted variables in the "cruise_secrets" group:
  #   ENV_API_KEY, ENV_HMAC_SECRET, ENV_EMAILJS_SERVICE_ID,
  #   ENV_EMAILJS_TEMPLATE_ID, ENV_EMAILJS_PUBLIC_KEY, ENV_EMAILJS_PRIVATE_KEY,
  #   ENV_STRIPE_PK, ENV_TWILIO_SID, ENV_TWILIO_TOKEN, ENV_TWILIO_SERVICE,
  #   ENV_MAPS_SERVICES_KEY, ENV_PAYPAL_CLIENT_ID, ENV_PAYPAL_SECRET,
  #   GOOGLE_MAPS_API_KEY, MAPBOX_ACCESS_TOKEN
  #
  # Non-secret defaults (safe to keep in YAML):
  vars: &shared_vars
    ENV_STRIPE_MERCHANT: "merchant.com.cruise.app"
    ENV_PAYPAL_SANDBOX: "false"

  # ── Reusable script anchors ───────────────────────────────────────────────
  scripts:
    - &configure_git
      name: Configure Git for large transfers
      script: |
        git config --global http.postBuffer 524288000
        git config --global http.lowSpeedLimit 0
        git config --global http.lowSpeedTime 999999

    - &mapbox_auth
      name: Configure Mapbox downloads token
      script: |
        TOKEN="${ENV_MAPBOX_TOKEN:-}"
        if [ -z "$TOKEN" ]; then
          echo "ERROR: ENV_MAPBOX_TOKEN is not set. Add it as a secret variable in Codemagic app settings."; exit 1
        fi
        # Strip any accidental whitespace/newlines from the token
        TOKEN="$(echo "$TOKEN" | tr -d '[:space:]')"
        if echo "$TOKEN" | grep -q '^pk\.'; then
          echo "ERROR: ENV_MAPBOX_TOKEN starts with 'pk.' — this is a PUBLIC token and cannot download the SDK."
          echo "Create a SECRET token (sk.) with Downloads:Read scope at account.mapbox.com/access-tokens"; exit 1
        fi
        # Android SDK: Gradle reads MAPBOX_DOWNLOADS_TOKEN from ~/.gradle/gradle.properties
        mkdir -p ~/.gradle
        printf 'MAPBOX_DOWNLOADS_TOKEN=%s\n' "$TOKEN" >> ~/.gradle/gradle.properties
        # iOS / CocoaPods: reads from ~/.netrc (write to both $HOME and explicit /Users paths)
        NETRC_CONTENT="machine api.mapbox.com
        login mapbox
        password ${TOKEN}
        "
        echo "$NETRC_CONTENT" > ~/.netrc
        chmod 0600 ~/.netrc
        # Also write to root's home in case HOME differs during pod install
        if [ -d "/Users/builder" ]; then
          echo "$NETRC_CONTENT" > /Users/builder/.netrc
          chmod 0600 /Users/builder/.netrc
        fi
        echo "Mapbox downloads token configured (sk. token OK)"
        echo "HOME=$HOME  |  .netrc path: $(ls -la ~/.netrc)"
        PREVIEW="${TOKEN:0:12}…"
        echo "Token preview: $PREVIEW  |  .netrc size: $(wc -c < ~/.netrc) bytes"
        # Verify .netrc is readable by curl with --netrc flag (same as CocoaPods uses)
        HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" --netrc \
          "https://api.mapbox.com/downloads/v2/mapbox-common/releases/ios/packages/24.20.0/MapboxCommon.zip" \
          --range 0-0 --retry 0 2>/dev/null || echo "000")
        if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "206" ]; then
          echo "✅ Mapbox auth test passed (HTTP $HTTP_CODE)"
        else
          echo "⚠️ --netrc test returned HTTP $HTTP_CODE, trying -u basic auth..."
          HTTP_CODE2=$(curl -s -o /dev/null -w "%{http_code}" \
            -u "mapbox:$TOKEN" \
            "https://api.mapbox.com/downloads/v2/mapbox-common/releases/ios/packages/24.20.0/MapboxCommon.zip" \
            --range 0-0 --retry 0 2>/dev/null || echo "000")
          if [ "$HTTP_CODE2" = "200" ] || [ "$HTTP_CODE2" = "206" ]; then
            echo "✅ Basic auth works (HTTP $HTTP_CODE2) — .netrc format issue, re-writing..."
            printf "machine api.mapbox.com\n  login mapbox\n  password %s\n" "$TOKEN" > ~/.netrc
            chmod 0600 ~/.netrc
            [ -d "/Users/builder" ] && cp ~/.netrc /Users/builder/.netrc && chmod 0600 /Users/builder/.netrc
          else
            echo "❌ Both auth methods FAILED — token is invalid. Check ENV_MAPBOX_TOKEN in Codemagic"
            exit 1
          fi
        fi

    - &generate_env
      name: Generate env.dart
      script: |
        mkdir -p lib/config
        python3 << 'PYEOF'
        import os
        sandbox_val = os.environ.get('ENV_PAYPAL_SANDBOX', 'false').lower()
        sandbox_bool = 'true' if sandbox_val == 'true' else 'false'
        lines = [
          'class Env {',
          "  static const String apiKey = '" + os.environ.get('ENV_API_KEY', 'dev-api-key-change-in-production') + "';",
          "  static const String hmacSecret = '" + os.environ.get('ENV_HMAC_SECRET', 'dev-hmac-secret-change-in-production') + "';",
          "  static const String mapsServicesKey = '" + os.environ.get('ENV_MAPS_SERVICES_KEY', '') + "';",
          "  static const String emailjsServiceId = '" + os.environ.get('ENV_EMAILJS_SERVICE_ID', '') + "';",
          "  static const String emailjsTemplateId = '" + os.environ.get('ENV_EMAILJS_TEMPLATE_ID', '') + "';",
          "  static const String emailjsPublicKey = '" + os.environ.get('ENV_EMAILJS_PUBLIC_KEY', '') + "';",
          "  static const String emailjsPrivateKey = '" + os.environ.get('ENV_EMAILJS_PRIVATE_KEY', '') + "';",
          "  static const String stripePublishableKey = '" + os.environ.get('ENV_STRIPE_PK', '') + "';",
          "  static const String stripeMerchantId = '" + os.environ.get('ENV_STRIPE_MERCHANT', '') + "';",
          "  static const String twilioAccountSid = '" + os.environ.get('ENV_TWILIO_SID', '') + "';",
          "  static const String twilioAuthToken = '" + os.environ.get('ENV_TWILIO_TOKEN', '') + "';",
          "  static const String twilioServiceSid = '" + os.environ.get('ENV_TWILIO_SERVICE', '') + "';",
          '  static const bool paypalSandbox = ' + sandbox_bool + ';',
          "  static const String paypalClientId = '" + os.environ.get('ENV_PAYPAL_CLIENT_ID', '') + "';",
          "  static const String paypalSecret = '" + os.environ.get('ENV_PAYPAL_SECRET', '') + "';",
          '}',
        ]
        with open('lib/config/env.dart', 'w') as f:
            f.write('\n'.join(lines) + '\n')
        print('env.dart generated successfully')
        PYEOF
        echo "env.dart generated"

        # ── Inject API keys for native manifests ──
        # Android: gradle reads from env vars directly (build.gradle.kts handles this)
        # iOS: write Secrets.xcconfig so Info.plist resolves $(GOOGLE_MAPS_API_KEY) etc.
        mkdir -p ios/Flutter
        cat > ios/Flutter/Secrets.xcconfig << XCEOF
        GOOGLE_MAPS_API_KEY=${GOOGLE_MAPS_API_KEY:-}
        MAPBOX_ACCESS_TOKEN=${MAPBOX_ACCESS_TOKEN:-}
        XCEOF
        echo "iOS Secrets.xcconfig generated"

    - &flutter_pub_get
      name: Get Flutter packages
      script: flutter pub get

    - &flutter_test
      name: Run Flutter tests
      script: flutter test --reporter compact

    - &backend_test
      name: Run backend tests
      script: |
        cd backend
        pip3 install -q -r requirements.txt
        python -m pytest tests/ -v --tb=short || true

    - &pod_install
      name: Install CocoaPods dependencies
      script: |
        cd ios
        rm -rf Pods Podfile.lock
        export COCOAPODS_DISABLE_STATS=true
        # .netrc is already configured by the mapbox_auth step for binary downloads.
        # The Podfile only sources github.com/CocoaPods/Specs.git (no Mapbox CDN source),
        # so CocoaPods will never try to clone api.mapbox.com.
        # MapboxMaps podspec is found in the public CocoaPods specs repo.
        for i in 1 2 3; do
          echo "=== pod install attempt $i/3 ==="
          if pod install --repo-update; then
            echo "✅ CocoaPods installed on attempt $i"
            break
          fi
          if [ $i -lt 3 ]; then
            WAIT=$((i * 45))
            echo "⚠️ Attempt $i failed, waiting ${WAIT}s..."
            sleep $WAIT
          else
            echo "❌ All pod install attempts failed"; exit 1
          fi
        done
        [ -d Pods ] && [ -n "$(ls -A Pods)" ] || { echo "ERROR: Pods missing or empty"; exit 1; }
        echo "CocoaPods installed. Size: $(du -sh Pods | cut -f1)"

    - &decode_keystore
      name: Decode Android keystore
      script: |
        if [ -n "${CM_KEYSTORE:-}" ]; then
          echo "$CM_KEYSTORE" | base64 --decode > /tmp/cruise-release.keystore
          echo "✅ Keystore decoded: $(du -sh /tmp/cruise-release.keystore | cut -f1)"
        else
          echo "⚠️  CM_KEYSTORE not set — release build will use debug signing"
        fi

    - &patch_no_codesign
      name: Disable code signing in Xcode project
      script: |
        cd ios
        python3 << 'PYEOF'
        import re, glob
        def patch(path):
            with open(path, 'r') as f: c = f.read()
            c = re.sub(r'\s*CODE_SIGN_ENTITLEMENTS = [^;]*;', '', c)
            c = re.sub(r'"CODE_SIGN_IDENTITY\[sdk=iphoneos\*\]" = "[^"]*"',
                       '"CODE_SIGN_IDENTITY[sdk=iphoneos*]" = ""', c)
            c = re.sub(r'CODE_SIGN_IDENTITY = "[^"]*"', 'CODE_SIGN_IDENTITY = ""', c)
            c = re.sub(r'DEVELOPMENT_TEAM = [^;]*;', 'DEVELOPMENT_TEAM = "";', c)
            c = re.sub(r'CODE_SIGN_STYLE = Automatic', 'CODE_SIGN_STYLE = Manual', c)
            c = re.sub(r'VALIDATE_PRODUCT = YES', 'VALIDATE_PRODUCT = NO', c)
            c = re.sub(r'\n\s*CODE_SIGNING_ALLOWED = [^;]*;', '', c)
            c = re.sub(r'\n\s*CODE_SIGNING_REQUIRED = [^;]*;', '', c)
            c = c.replace('buildSettings = {',
                'buildSettings = {\n\t\t\t\tCODE_SIGNING_ALLOWED = NO;\n\t\t\t\tCODE_SIGNING_REQUIRED = NO;')
            with open(path, 'w') as f: f.write(c)
            print(f"Patched: {path}")
        patch('Runner.xcodeproj/project.pbxproj')
        for p in glob.glob('Pods/**/*.pbxproj', recursive=True): patch(p)
        PYEOF
        printf 'CODE_SIGNING_ALLOWED=NO\nCODE_SIGNING_REQUIRED=NO\nCODE_SIGN_IDENTITY=\nCODE_SIGN_ENTITLEMENTS=\nEXPANDED_CODE_SIGN_IDENTITY=\n' >> Flutter/Release.xcconfig

    - &delete_stale_profiles
      name: Delete stale App Store provisioning profiles
      script: |
        python3 << 'PYEOF'
        import base64, json, time, os, subprocess, urllib.request, sys
        def b64url(d):
            if isinstance(d, str): d = d.encode()
            return base64.urlsafe_b64encode(d).rstrip(b'=').decode()
        try:
            key_id    = os.environ.get('APP_STORE_CONNECT_KEY_IDENTIFIER', '')
            issuer_id = os.environ.get('APP_STORE_CONNECT_ISSUER_ID', '')
            priv_key  = os.environ.get('APP_STORE_CONNECT_PRIVATE_KEY', '')
            if not all([key_id, issuer_id, priv_key]):
                print('Missing ASC credentials, skipping'); sys.exit(0)
            priv_key = priv_key.replace('\\n', '\n')
            with open('/tmp/asc_key.p8', 'w') as f: f.write(priv_key)
            hdr = b64url(json.dumps({"alg":"ES256","kid":key_id}, separators=(',',':')))
            now = int(time.time())
            pay = b64url(json.dumps({"iss":issuer_id,"iat":now,"exp":now+600,
                                      "aud":"appstoreconnect-v1"}, separators=(',',':')))
            msg = f"{hdr}.{pay}"
            r = subprocess.run(['openssl','dgst','-sha256','-sign','/tmp/asc_key.p8','-binary'],
                               input=msg.encode(), capture_output=True)
            os.unlink('/tmp/asc_key.p8')
            der = r.stdout
            if not der: print(f'openssl failed: {r.stderr.decode()}'); sys.exit(0)
            pos=2; rl=der[pos+1]; rv=der[pos+2:pos+2+rl]; pos+=2+rl
            sl=der[pos+1]; sv=der[pos+2:pos+2+sl]
            rv=rv.lstrip(b'\x00').rjust(32,b'\x00'); sv=sv.lstrip(b'\x00').rjust(32,b'\x00')
            token=f"{msg}.{b64url(rv+sv)}"
            hdrs={"Authorization":f"Bearer {token}","Content-Type":"application/json"}
            url=("https://api.appstoreconnect.apple.com/v1/profiles"
                 "?filter[profileType]=IOS_APP_STORE"
                 "&filter[bundleId.identifier]=com.cruiseinride.app&limit=50")
            with urllib.request.urlopen(urllib.request.Request(url,headers=hdrs)) as resp:
                data=json.loads(resp.read())
            for p in data.get('data',[]):
                pid=p['id']; name=p.get('attributes',{}).get('name','?')
                print(f'Deleting: {name} ({pid})')
                try:
                    urllib.request.urlopen(urllib.request.Request(
                        f"https://api.appstoreconnect.apple.com/v1/profiles/{pid}",
                        method='DELETE',headers=hdrs))
                    print('  ✅ deleted')
                except Exception as e: print(f'  ❌ {e}')
        except Exception as e: print(f'Profile deletion skipped: {e}')
        PYEOF

workflows:
  # ────────────────────────────────────────────────────────────────────────────
  # 1. iOS Sideload — unsigned IPA for Sideloadly / AltStore
  #    Trigger: MANUAL only (start from Codemagic UI)
  # ────────────────────────────────────────────────────────────────────────────
  ios-sideload:
    name: iOS IPA (Sideloadly — unsigned)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      groups:
        - Default
        - cruise_secrets
      flutter: stable
      xcode: 26.0
      cocoapods: 1.15.2
      vars:
        <<: *shared_vars
        FLUTTER_XCODE_CODE_SIGNING_ALLOWED: "NO"
        FLUTTER_XCODE_CODE_SIGNING_REQUIRED: "NO"
    scripts:
      - *generate_env
      - *configure_git
      - *mapbox_auth
      - *flutter_pub_get
      - *flutter_test
      - *backend_test
      - *pod_install
      - *patch_no_codesign
      - name: Flutter build iOS (unsigned)
        script: |
          flutter build ios --release --no-codesign --no-tree-shake-icons
          APP="build/ios/iphoneos/Runner.app"
          [ -d "$APP" ] || { find build/ios -type d -name "*.app"; exit 1; }
          APP_SIZE=$(du -sm "$APP" | cut -f1)
          echo "Runner.app: ${APP_SIZE} MB"
          [ "$APP_SIZE" -gt 5 ] || { echo "ERROR: App too small (${APP_SIZE} MB)"; exit 1; }
      - name: Package as IPA
        script: |
          APP_PATH="build/ios/iphoneos/Runner.app"
          [ -d "$APP_PATH" ] || { echo "ERROR: Runner.app not found"; exit 1; }
          rm -rf build/ios/ipa && mkdir -p build/ios/ipa/Payload
          cp -r "$APP_PATH" build/ios/ipa/Payload/Runner.app
          cd build/ios/ipa
          zip -r cruise-app.ipa Payload
          IPA_SIZE=$(stat -f%z cruise-app.ipa 2>/dev/null || stat -c%s cruise-app.ipa 2>/dev/null)
          echo "IPA: ${IPA_SIZE} bytes"
          [ "${IPA_SIZE}" -gt 50000 ] || { echo "ERROR: IPA too small"; exit 1; }
    artifacts:
      - build/ios/ipa/cruise-app.ipa
      - /tmp/xcodebuild_logs/*.log

  # ────────────────────────────────────────────────────────────────────────────
  # 2. iOS Ad Hoc — signed IPA for direct device install
  #    Trigger: push to main
  # ────────────────────────────────────────────────────────────────────────────
  ios-adhoc:
    name: iOS Ad Hoc (device install)
    max_build_duration: 120
    instance_type: mac_mini_m2
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
    integrations:
      app_store_connect: CruiseinRide
    environment:
      groups:
        - Default
        - cruise_secrets
      flutter: stable
      xcode: 26.0
      cocoapods: 1.15.2
      vars:
        <<: *shared_vars
        BUNDLE_ID: "com.cruiseinride.app"
    scripts:
      - *generate_env
      - *configure_git
      - *mapbox_auth
      - *flutter_pub_get
      - *pod_install
      - name: Set up code signing (Ad Hoc)
        script: |
          if [ -z "${CERTIFICATE_PRIVATE_KEY:-}" ]; then
            echo "❌ CERTIFICATE_PRIVATE_KEY not set"; exit 1
          fi
          export CERTIFICATE_PRIVATE_KEY="$(echo "$CERTIFICATE_PRIVATE_KEY" | base64 --decode)"
          echo "✅ Key decoded for Ad Hoc"
          keychain initialize
          app-store-connect certificates delete \
            --type IOS_DISTRIBUTION \
            --certificate-key=@env:CERTIFICATE_PRIVATE_KEY \
            2>/dev/null || true
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_ADHOC \
            --create \
            --strict-match-identifier \
            --delete-stale-profiles \
            --certificate-key=@env:CERTIFICATE_PRIVATE_KEY \
            --verbose
          keychain add-certificates

          # ── Extract profile info ──
          PROFILE_PATH=$(find "$HOME/Library/MobileDevice/Provisioning Profiles" \
            "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles" \
            -name "*.mobileprovision" 2>/dev/null | head -1)
          if [ -z "$PROFILE_PATH" ]; then
            echo "❌ No provisioning profile downloaded"; exit 1
          fi
          PLIST=$(security cms -D -i "$PROFILE_PATH" 2>/dev/null)
          PROFILE_UUID=$(echo "$PLIST" | grep -A1 '<key>UUID</key>' | tail -1 \
            | sed 's/.*<string>//' | sed 's/<\/string>.*//' | tr -d '[:space:]')
          PROFILE_NAME=$(echo "$PLIST" | grep -A1 '<key>Name</key>' | tail -1 \
            | sed 's/.*<string>//' | sed 's/<\/string>.*//' | xargs)
          echo "✅ Profile: '$PROFILE_NAME' ($PROFILE_UUID)"

          # ── Patch pbxproj ──
          PBXPROJ="ios/Runner.xcodeproj/project.pbxproj"
          perl -i -ne 'print unless /^\s*PROVISIONING_PROFILE/' "$PBXPROJ"
          perl -i -pe 's/CODE_SIGN_IDENTITY = "[^"]*"/CODE_SIGN_IDENTITY = "Apple Distribution"/g' "$PBXPROJ"
          perl -i -pe "s{(CODE_SIGN_STYLE = Manual;)}{\$1\n\t\t\t\tPROVISIONING_PROFILE_SPECIFIER = \"${PROFILE_NAME}\";\n\t\t\t\tPROVISIONING_PROFILE = \"${PROFILE_UUID}\";}" "$PBXPROJ"

          # ── FLUTTER_XCODE env vars ──
          echo "FLUTTER_XCODE_CODE_SIGN_STYLE=Manual" >> $CM_ENV
          echo "FLUTTER_XCODE_DEVELOPMENT_TEAM=7QLC9UVB3Z" >> $CM_ENV
          echo "FLUTTER_XCODE_CODE_SIGN_IDENTITY=Apple Distribution" >> $CM_ENV
          echo "FLUTTER_XCODE_PROVISIONING_PROFILE_SPECIFIER=${PROFILE_NAME}" >> $CM_ENV
          echo "FLUTTER_XCODE_PROVISIONING_PROFILE=${PROFILE_UUID}" >> $CM_ENV

          # ── Generate export_options.plist ──
          export PROFILE_NAME
          python3 - << 'PYEOF'
          import plistlib, os, pathlib
          name = os.environ["PROFILE_NAME"]
          pl = {
              "method": "ad-hoc",
              "teamID": "7QLC9UVB3Z",
              "signingStyle": "manual",
              "provisioningProfiles": {
                  "com.cruiseinride.app": name,
              },
          }
          out = pathlib.Path.home() / "export_options.plist"
          with open(out, "wb") as f:
              plistlib.dump(pl, f)
          print(f"Created {out}")
          PYEOF
          security find-identity -v -p codesigning
          echo "✅ Ad Hoc signing ready"
      - name: Flutter build IPA (Ad Hoc)
        script: |
          flutter build ipa --release --no-tree-shake-icons \
            --export-options-plist=$HOME/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      email:
        recipients:
          - josmash2021@gmail.com
        notify:
          success: true
          failure: true

  # ────────────────────────────────────────────────────────────────────────────
  # 3. iOS App Store — TestFlight submission
  #    Trigger: MANUAL only
  # ────────────────────────────────────────────────────────────────────────────
  ios-release:
    name: iOS App Store (TestFlight)
    max_build_duration: 120
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: CruiseinRide
    environment:
      groups:
        - Default
        - cruise_secrets
      flutter: stable
      xcode: 26.0
      cocoapods: 1.15.2
      vars:
        <<: *shared_vars
        BUNDLE_ID: "com.cruiseinride.app"
    scripts:
      - *generate_env
      - *configure_git
      - *mapbox_auth
      - *flutter_pub_get
      - *pod_install
      - name: Set up iOS code signing
        script: |
          # ── Decode CERTIFICATE_PRIVATE_KEY from base64 → raw PEM ──────────
          if [ -z "${CERTIFICATE_PRIVATE_KEY:-}" ]; then
            echo "❌ CERTIFICATE_PRIVATE_KEY is not set!"
            exit 1
          fi
          # Overwrite env var with decoded PEM (preserves newlines in shell)
          export CERTIFICATE_PRIVATE_KEY="$(echo "$CERTIFICATE_PRIVATE_KEY" | base64 --decode)"
          echo "$CERTIFICATE_PRIVATE_KEY" | head -1
          echo "✅ Key decoded ($(echo "$CERTIFICATE_PRIVATE_KEY" | wc -c | tr -d ' ') bytes)"

          keychain initialize

          # Delete stale certs that don't match our private key
          app-store-connect certificates delete \
            --type IOS_DISTRIBUTION \
            --certificate-key=@env:CERTIFICATE_PRIVATE_KEY \
            2>/dev/null || true

          # Delete ALL existing App Store profiles to prevent 409 duplicate name conflict
          echo "── Cleaning up existing profiles ──"
          app-store-connect profiles list \
            --type IOS_APP_STORE \
            --json 2>/dev/null \
            | python3 -c "
          import sys, json
          try:
              data = json.load(sys.stdin)
              for p in data:
                  pid = p.get('id','')
                  name = p.get('attributes',{}).get('name','?')
                  print(f'{pid} {name}')
          except: pass
          " | while read -r pid name; do
            echo "  Deleting profile: $name ($pid)"
            app-store-connect profiles delete "$pid" 2>/dev/null || true
          done
          echo "── Profile cleanup done ──"

          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create \
            --strict-match-identifier \
            --certificate-key=@env:CERTIFICATE_PRIVATE_KEY \
            --verbose

          keychain add-certificates

          # ── Extract profile info ──────────────────────────────────────────
          PROFILE_PATH=$(find "$HOME/Library/MobileDevice/Provisioning Profiles" \
            "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles" \
            -name "*.mobileprovision" 2>/dev/null | head -1)
          if [ -z "$PROFILE_PATH" ]; then
            echo "❌ No provisioning profile downloaded"
            echo "Checking MobileDevice:" && ls -la "$HOME/Library/MobileDevice/Provisioning Profiles/" 2>/dev/null || true
            echo "Checking Xcode UserData:" && ls -la "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/" 2>/dev/null || true
            exit 1
          fi
          echo "Profile file: $PROFILE_PATH"

          PLIST=$(security cms -D -i "$PROFILE_PATH" 2>/dev/null)
          if [ -z "$PLIST" ]; then
            echo "❌ security cms failed to decode the profile"
            exit 1
          fi

          PROFILE_UUID=$(echo "$PLIST" | grep -A1 '<key>UUID</key>' | tail -1 \
            | sed 's/.*<string>//' | sed 's/<\/string>.*//' | tr -d '[:space:]')
          PROFILE_NAME=$(echo "$PLIST" | grep -A1 '<key>Name</key>' | tail -1 \
            | sed 's/.*<string>//' | sed 's/<\/string>.*//' | xargs)

          if [ -z "$PROFILE_UUID" ] || [ -z "$PROFILE_NAME" ]; then
            echo "❌ Could not extract UUID or Name from profile"
            echo "   UUID='$PROFILE_UUID'  NAME='$PROFILE_NAME'"
            echo "$PLIST" | head -40
            exit 1
          fi
          echo "✅ Profile: '$PROFILE_NAME' ($PROFILE_UUID)"

          # ── Detect signing identity from keychain ─────────────────────────
          IDENTITY=$(security find-identity -v -p codesigning \
            | grep -o '"[^"]*"' | head -1 | tr -d '"')
          echo "✅ Identity: '$IDENTITY'"

          # ── Patch pbxproj: clean + reinject all signing fields ────────────
          PBXPROJ="ios/Runner.xcodeproj/project.pbxproj"

          # 1) Strip any stale PROVISIONING_PROFILE* lines
          perl -i -ne 'print unless /^\s*PROVISIONING_PROFILE/' "$PBXPROJ"

          # 2) Ensure CODE_SIGN_IDENTITY matches the actual certificate
          perl -i -pe 's/CODE_SIGN_IDENTITY = "[^"]*"/CODE_SIGN_IDENTITY = "Apple Distribution"/g' "$PBXPROJ"

          # 3) Inject fresh PROVISIONING_PROFILE_SPECIFIER + PROVISIONING_PROFILE
          #    after every CODE_SIGN_STYLE = Manual; (covers Debug, Profile, Release)
          perl -i -pe "s{(CODE_SIGN_STYLE = Manual;)}{\$1\n\t\t\t\tPROVISIONING_PROFILE_SPECIFIER = \"${PROFILE_NAME}\";\n\t\t\t\tPROVISIONING_PROFILE = \"${PROFILE_UUID}\";}" "$PBXPROJ"

          # ── Set FLUTTER_XCODE_* env vars (override at xcodebuild level) ───
          echo "FLUTTER_XCODE_CODE_SIGN_STYLE=Manual" >> $CM_ENV
          echo "FLUTTER_XCODE_DEVELOPMENT_TEAM=7QLC9UVB3Z" >> $CM_ENV
          echo "FLUTTER_XCODE_CODE_SIGN_IDENTITY=Apple Distribution" >> $CM_ENV
          echo "FLUTTER_XCODE_PROVISIONING_PROFILE_SPECIFIER=${PROFILE_NAME}" >> $CM_ENV
          echo "FLUTTER_XCODE_PROVISIONING_PROFILE=${PROFILE_UUID}" >> $CM_ENV

          # ── Generate export_options.plist ──────────────────────────────────
          export PROFILE_NAME
          python3 - << 'PYEOF'
          import plistlib, os, pathlib
          name = os.environ["PROFILE_NAME"]
          pl = {
              "method": "app-store",
              "teamID": "7QLC9UVB3Z",
              "signingStyle": "manual",
              "uploadSymbols": True,
              "provisioningProfiles": {
                  "com.cruiseinride.app": name,
              },
          }
          out = pathlib.Path.home() / "export_options.plist"
          with open(out, "wb") as f:
              plistlib.dump(pl, f)
          print(f"Created {out}")
          PYEOF
          cat "$HOME/export_options.plist"

          # ── Diagnostics ───────────────────────────────────────────────────
          echo "── Signing identities ──"
          security find-identity -v -p codesigning
          echo "── Profiles ──"
          ls -la "$HOME/Library/MobileDevice/Provisioning Profiles/" 2>/dev/null || true
          ls -la "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/" 2>/dev/null || true
          echo "── pbxproj signing fields ──"
          grep -E 'PROVISIONING_PROFILE|CODE_SIGN_STYLE|DEVELOPMENT_TEAM|CODE_SIGN_IDENTITY' "$PBXPROJ" | head -24
          echo "── FLUTTER_XCODE env vars ──"
          cat $CM_ENV 2>/dev/null | grep FLUTTER_XCODE || true
          echo "✅ Signing ready"
      - name: Build IPA (App Store)
        script: |
          set -o pipefail
          flutter build ipa \
            --release \
            --no-tree-shake-icons \
            --build-number=$BUILD_NUMBER \
            --export-options-plist=$HOME/export_options.plist

          IPA_PATH=$(find build/ios/ipa -name "*.ipa" 2>/dev/null | head -1)
          if [ -z "$IPA_PATH" ]; then
            echo "❌ No IPA file found"
            ls -laR build/ios/ipa/ 2>/dev/null || true
            exit 1
          fi
          echo "✅ IPA created: $IPA_PATH ($(du -sh "$IPA_PATH" | cut -f1))"
      - name: Upload dSYMs to Firebase Crashlytics
        script: |
          DSYM_DIR="build/ios/archive/Runner.xcarchive/dSYMs"
          GSP="ios/Runner/GoogleService-Info.plist"
          UPLOAD_SCRIPT=$(find ios/Pods -name "upload-symbols" -path "*/FirebaseCrashlytics/*" 2>/dev/null | head -1)
          if [ -z "$UPLOAD_SCRIPT" ]; then
            echo "⚠️  upload-symbols not found in Pods — skipping dSYM upload"
            exit 0
          fi
          if [ ! -d "$DSYM_DIR" ]; then
            echo "⚠️  dSYM directory not found at $DSYM_DIR — skipping"
            exit 0
          fi
          echo "Uploading dSYMs from $DSYM_DIR …"
          "$UPLOAD_SCRIPT" -gsp "$GSP" -p ios "$DSYM_DIR"
          echo "✅ dSYMs uploaded to Firebase Crashlytics"
    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios/archive/Runner.xcarchive/dSYMs/*.dSYM
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
      email:
        recipients:
          - josmash2021@gmail.com
        notify:
          success: true
          failure: true

  # ────────────────────────────────────────────────────────────────────────────
  # 4. Android APK — release APK with keystore signing
  #    Trigger: push to main
  #    Add these as encrypted vars in Codemagic UI:
  #      CM_KEYSTORE, CM_KEYSTORE_PASSWORD, CM_KEY_ALIAS, CM_KEY_PASSWORD
  # ────────────────────────────────────────────────────────────────────────────
  android-apk:
    name: Android APK (release)
    max_build_duration: 60
    instance_type: linux_x2
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
    environment:
      groups:
        - Default
        - cruise_secrets
      flutter: stable
      java: 17
      vars:
        <<: *shared_vars
    scripts:
      - name: Write android/local.properties
        script: |
          echo "MAPS_API_KEY=$ENV_MAPS_SERVICES_KEY" >> android/local.properties
          echo "sdk.dir=$ANDROID_SDK_ROOT" >> android/local.properties
      - *generate_env
      - *mapbox_auth
      - *decode_keystore
      - *flutter_pub_get
      - *flutter_test
      - *backend_test
      - name: Build APK
        script: |
          flutter build apk --release --no-tree-shake-icons --build-number=$BUILD_NUMBER
          APK=$(find build/app/outputs -name "*.apk" | head -1)
          echo "APK: $APK  ($(du -sh "$APK" | cut -f1))"
    artifacts:
      - build/app/outputs/**/*.apk
    publishing:
      email:
        recipients:
          - josmash2021@gmail.com
        notify:
          success: true
          failure: true

  # ────────────────────────────────────────────────────────────────────────────
  # 5. Android AAB — Play Store bundle (signed)
  #    Trigger: push of a git tag (e.g. v1.2.3)
  # ────────────────────────────────────────────────────────────────────────────
  android-release:
    name: Android AAB (Play Store)
    max_build_duration: 60
    instance_type: linux_x2
    triggering:
      events:
        - tag
      branch_patterns:
        - pattern: main
          include: true
          source: true
    environment:
      groups:
        - Default
        - cruise_secrets
      flutter: stable
      java: 17
      vars:
        <<: *shared_vars
    scripts:
      - name: Write android/local.properties
        script: |
          echo "MAPS_API_KEY=$ENV_MAPS_SERVICES_KEY" >> android/local.properties
          echo "sdk.dir=$ANDROID_SDK_ROOT" >> android/local.properties
      - *generate_env
      - *mapbox_auth
      - name: Decode keystore (required for Play Store)
        script: |
          if [ -z "${CM_KEYSTORE:-}" ]; then
            echo "❌ CM_KEYSTORE not set — cannot build a signed Play Store AAB"; exit 1
          fi
          echo "$CM_KEYSTORE" | base64 --decode > /tmp/cruise-release.keystore
          echo "✅ Keystore decoded: $(du -sh /tmp/cruise-release.keystore | cut -f1)"
      - *flutter_pub_get
      - name: Build AAB
        script: |
          flutter build appbundle --release --no-tree-shake-icons --build-number=$BUILD_NUMBER
    artifacts:
      - build/app/outputs/**/*.aab
    publishing:
      email:
        recipients:
          - josmash2021@gmail.com
        notify:
          success: true
          failure: true