<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Verification - Cruise</title>
</head>
<body style="margin: 0; padding: 0; background-color: #0e0e10; font-family: 'Helvetica Neue', Arial, sans-serif;">

  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color: #0e0e10; padding: 56px 16px;">
    <tr>
      <td align="center">

        <table role="presentation" width="480" cellpadding="0" cellspacing="0" style="max-width: 100%;">

          <!-- Logo -->
          <tr>
            <td align="center" style="padding-bottom: 40px;">
              <img src="https://cdn.shopify.com/s/files/1/0805/8640/8191/files/Untitled_design_069defa2-9e36-4d98-831f-f776d4c6f7a5.png?v=1772961171"
                   alt="Cruise" width="120"
                   style="display: block; margin: 0 auto; max-width: 120px; height: auto; border: 0;" />
            </td>
          </tr>

          <!-- Heading -->
          <tr>
            <td align="center" style="padding-bottom: 12px;">
              <p style="margin: 0; font-size: 20px; font-weight: 300; color: #ffffff; letter-spacing: 0.2px;">
                Your verification code
              </p>
            </td>
          </tr>

          <tr>
            <td align="center" style="padding-bottom: 36px;">
              <p style="margin: 0; font-size: 13px; color: #8a8a8e; line-height: 1.6;">
                Enter this code in the app to continue.<br />
                It expires in <strong style="color: #d4a843; font-weight: 600;">10 minutes</strong>.
              </p>
            </td>
          </tr>

          <!-- Code -->
          <tr>
            <td align="center" style="padding-bottom: 36px;">
              <table role="presentation" cellpadding="0" cellspacing="0">
                <tr>
                  <td align="center" style="background-color: #141416; border: 1px solid #2a2a30; border-radius: 12px; padding: 22px 44px;">
                    <span style="font-size: 32px; font-weight: 600; color: #d4a843; letter-spacing: 10px; text-indent: 10px;">{{code}}</span>
                  </td>
                </tr>
              </table>
            </td>
          </tr>

          <!-- Divider -->
          <tr>
            <td align="center" style="padding-bottom: 28px;">
              <table role="presentation" cellpadding="0" cellspacing="0" width="48">
                <tr>
                  <td style="height: 1px; background-color: #2a2a30; font-size: 0; line-height: 0;">&nbsp;</td>
                </tr>
              </table>
            </td>
          </tr>

          <!-- Footer note -->
          <tr>
            <td align="center" style="padding-bottom: 32px;">
              <p style="margin: 0; font-size: 12px; color: #5a5a60; line-height: 1.6;">
                If you didn't request this code, you can safely ignore this email.
              </p>
            </td>
          </tr>

          <!-- Brand footer -->
          <tr>
            <td align="center">
              <p style="margin: 0; font-size: 11px; color: #3a3a40; letter-spacing: 3px; text-transform: uppercase;">
                Cruise
              </p>
            </td>
          </tr>

        </table>

      </td>
    </tr>
  </table>

</body>
</html>
