<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Panel Neumorfismo — Demo</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; }

  body {
    background: #e0e5ec;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px;
  }

  .panel {
    background: #e0e5ec;
    border-radius: 30px;
    padding: 40px;
    width: 420px;
    /* Sombra doble: oscura abajo-derecha, clara arriba-izquierda = efecto "extruido" */
    box-shadow: 12px 12px 24px #a3b1c6,
               -12px -12px 24px #ffffff;
  }

  .panel h1 {
    color: #4a5568;
    font-size: 22px;
    font-weight: 600;
    margin-bottom: 6px;
  }

  .panel p.sub {
    color: #9aa5b8;
    font-size: 13px;
    margin-bottom: 30px;
  }

  /* --- Tarjetas de estadísticas --- */
  .stats {
    display: flex;
    gap: 20px;
    margin-bottom: 30px;
  }

  .stat {
    flex: 1;
    background: #e0e5ec;
    border-radius: 20px;
    padding: 20px;
    text-align: center;
    box-shadow: 8px 8px 16px #a3b1c6,
               -8px -8px 16px #ffffff;
  }

  .stat .num { color: #4a5568; font-size: 24px; font-weight: 700; }
  .stat .lbl { color: #9aa5b8; font-size: 11px; margin-top: 4px; }

  /* --- Input "hundido" (inset) --- */
  .field {
    margin-bottom: 24px;
  }

  .field label {
    display: block;
    color: #6b7686;
    font-size: 12px;
    margin-bottom: 8px;
  }

  .field input {
    width: 100%;
    border: none;
    outline: none;
    background: #e0e5ec;
    border-radius: 14px;
    padding: 14px 18px;
    font-size: 14px;
    color: #4a5568;
    /* Sombras internas = efecto "presionado / hundido" */
    box-shadow: inset 6px 6px 12px #a3b1c6,
                inset -6px -6px 12px #ffffff;
  }

  /* --- Toggle switch --- */
  .row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 24px;
  }

  .row span { color: #6b7686; font-size: 14px; }

  .toggle {
    width: 60px;
    height: 32px;
    border-radius: 16px;
    background: #e0e5ec;
    box-shadow: inset 4px 4px 8px #a3b1c6,
                inset -4px -4px 8px #ffffff;
    position: relative;
    cursor: pointer;
  }

  .toggle .knob {
    position: absolute;
    top: 4px;
    left: 4px;
    width: 24px;
    height: 24px;
    border-radius: 50%;
    background: #e0e5ec;
    box-shadow: 3px 3px 6px #a3b1c6,
               -3px -3px 6px #ffffff;
    transition: left .2s;
  }

  .toggle.on .knob { left: 32px; background: #6c9ef8; }

  /* --- Slider --- */
  .slider {
    width: 100%;
    height: 12px;
    border-radius: 6px;
    background: #e0e5ec;
    box-shadow: inset 4px 4px 8px #a3b1c6,
                inset -4px -4px 8px #ffffff;
    margin-bottom: 30px;
    position: relative;
  }

  .slider .fill {
    position: absolute;
    left: 0; top: 0;
    height: 100%;
    width: 65%;
    border-radius: 6px;
    background: linear-gradient(90deg, #6c9ef8, #8ab4ff);
  }

  .slider .thumb {
    position: absolute;
    left: 65%;
    top: 50%;
    transform: translate(-50%, -50%);
    width: 26px;
    height: 26px;
    border-radius: 50%;
    background: #e0e5ec;
    box-shadow: 4px 4px 8px #a3b1c6,
               -4px -4px 8px #ffffff;
  }

  /* --- Botones --- */
  .buttons { display: flex; gap: 16px; }

  .btn {
    flex: 1;
    border: none;
    border-radius: 14px;
    padding: 14px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    background: #e0e5ec;
    color: #6c9ef8;
    box-shadow: 6px 6px 12px #a3b1c6,
               -6px -6px 12px #ffffff;
    transition: box-shadow .15s;
  }

  .btn:active {
    box-shadow: inset 6px 6px 12px #a3b1c6,
                inset -6px -6px 12px #ffffff;
  }

  .btn.primary {
    background: linear-gradient(145deg, #6c9ef8, #5b8de8);
    color: #fff;
    box-shadow: 6px 6px 12px #a3b1c6,
               -6px -6px 12px #ffffff;
  }
</style>
</head>
<body>

<div class="panel">
  <h1>Panel de Control</h1>
  <p class="sub">Ejemplo de diseño neumórfico (soft UI)</p>

  <div class="stats">
    <div class="stat">
      <div class="num">128</div>
      <div class="lbl">VIAJES</div>
    </div>
    <div class="stat">
      <div class="num">4.9</div>
      <div class="lbl">RATING</div>
    </div>
    <div class="stat">
      <div class="num">$842</div>
      <div class="lbl">SEMANA</div>
    </div>
  </div>

  <div class="field">
    <label>Buscar destino</label>
    <input type="text" placeholder="Aeropuerto, hotel, dirección...">
  </div>

  <div class="row">
    <span>Modo en línea</span>
    <div class="toggle on" onclick="this.classList.toggle('on')">
      <div class="knob"></div>
    </div>
  </div>

  <div class="row">
    <span>Radio de búsqueda</span>
    <span style="color:#6c9ef8;font-weight:600">6.5 km</span>
  </div>

  <div class="slider">
    <div class="fill"></div>
    <div class="thumb"></div>
  </div>

  <div class="buttons">
    <button class="btn">Cancelar</button>
    <button class="btn primary">Aceptar viaje</button>
  </div>
</div>

</body>
</html>
