name: cruise_app
description: "Cruise — Premium ride-sharing app connecting riders with professional drivers."
publish_to: 'none'

version: 1.1.2+618

environment:
  sdk: ">=3.0.0 <4.0.0"

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  mapbox_maps_flutter: ^2.5.0
  flutter_typeahead: ^5.2.0
  geolocator: ^14.0.2
  # The device compass, for the driver's arrow. geolocator only reports course
  # over ground, which a parked car does not have — so the arrow could not turn
  # when the driver turned the phone. Android and iOS only; every call site is
  # behind a kIsWeb guard.
  flutter_compass: ^0.8.1
  geocoding: ^3.0.0
  flutter_background_service: ^5.1.0
  flutter_background_service_android: ^6.3.0
  flutter_background_service_ios: ^5.0.3
  http: ^1.6.0
  shared_preferences: ^2.3.3
  image_picker: ^1.1.2
  # Only for re-encoding the cropped document photo as JPEG: dart:ui can
  # decode anything but can only write PNG, and a PNG of a photograph is
  # several times the size of the JPEG it came from. Already resolved at
  # 4.8.0 as a transitive dependency, so this pins nothing new.
  image: ^4.8.0
  # Support-chat attachments. image_picker cannot select a PDF, so documents
  # need this. It is a native plugin: adding it means a full Codemagic /
  # Shorebird build, NOT an OTA patch.
  file_picker: ^8.1.6
  path_provider: ^2.1.4
  permission_handler: ^11.3.1
  # Apple Calendar read for the schedule hub's "Your calendars" card
  # (approved 2026-08-22). NOTE: `device_calendar` proper is abandoned and
  # pinned to timezone ^0.9.0 (this project is on ^0.11.0), so this is the
  # maintained fork — same lineage, iOS 17 full-access flow built in.
  device_calendar_plus: ^0.8.0
  url_launcher: ^6.3.1
  share_plus: ^10.1.4
  video_player: ^2.9.3
  package_info_plus: ^8.3.0
  flutter_stripe: ^11.4.0
  # Stripe Terminal SDK — Tap to Pay (NFC contactless on iPhone/Android).
  # Requires Apple's proximity-reader entitlement and Stripe Terminal account
  # approval. iOS 16.7+, iPhone XS+, Android 11+ with NFC.
  mek_stripe_terminal: ^4.6.3
  firebase_core: ^3.15.2
  cloud_firestore: ^5.6.12
  firebase_auth: ^5.7.0
  firebase_database: ^11.3.10
  firebase_storage: ^12.4.10
  firebase_messaging: ^15.2.10
  firebase_crashlytics: ^4.3.10
  firebase_analytics: ^11.6.0
  firebase_remote_config: ^5.5.0
  google_sign_in: ^6.2.2
  sign_in_with_apple: ^6.1.4
  intl: ^0.20.2
  crypto: ^3.0.6
  uuid: ^4.5.3
  flutter_local_notifications: ^21.0.0
  timezone: ^0.11.0
  local_auth: ^2.3.0
  google_fonts: ^6.2.1
  flutter_secure_storage: ^10.0.0
  camera: ^0.11.0+2
  google_mlkit_face_detection: ^0.13.0
  google_mlkit_text_recognition: ^0.15.1
  pay: ^2.0.0
  webview_flutter: ^4.7.0
  animations: ^2.1.1
  cached_network_image: ^3.3.0
  flutter_cache_manager: ^3.3.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  connectivity_plus: ^6.1.4
  audioplayers: ^6.1.0
  socket_io_client: ^2.0.3+1
  devtools_extensions: ^0.5.0
  mcp_dart: ^2.1.1
  mcp_toolkit: ^0.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/launcher_icon.png"
  adaptive_icon_background: "#FF000000"
  adaptive_icon_foreground: "assets/launcher_icon_foreground.png"
  remove_alpha_ios: true

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/images/
    - assets/images/onboarding/
    - assets/images/welcome_bg.mp4
    - assets/videos/airport_bg.mp4
    - assets/markers/
    - assets/google_fonts/
    - assets/fonts/
    - assets/pay/
    - assets/sounds/
    - assets/airport/
    - shorebird.yaml

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
