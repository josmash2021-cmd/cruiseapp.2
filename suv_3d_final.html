<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SUV 3D Top-Down</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            background: #e8e8e8;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
        }
        .container {
            padding: 40px;
        }
        svg {
            filter: drop-shadow(0 30px 60px rgba(0,0,0,0.35));
            max-width: 100%;
            height: auto;
        }
    </style>
</head>
<body>
    <div class="container">
        <svg viewBox="0 0 600 900" width="500" height="750" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <!-- 3D Body Shadow -->
                <filter id="shadow3d" x="-50%" y="-50%" width="200%" height="200%">
                    <feGaussianBlur in="SourceAlpha" stdDeviation="15"/>
                    <feOffset dx="0" dy="20" result="offsetblur"/>
                    <feComponentTransfer>
                        <feFuncA type="linear" slope="0.4"/>
                    </feComponentTransfer>
                    <feMerge>
                        <feMergeNode/>
                        <feMergeNode in="SourceGraphic"/>
                    </feMerge>
                </filter>
                
                <!-- Inner Shadow for depth -->
                <filter id="innerShadow">
                    <feOffset dx="0" dy="0"/>
                    <feGaussianBlur stdDeviation="5" result="offset-blur"/>
                    <feComposite operator="out" in="SourceGraphic" in2="offset-blur" result="inverse"/>
                    <feFlood flood-color="black" flood-opacity="0.3" result="color"/>
                    <feComposite operator="in" in="color" in2="inverse" result="shadow"/>
                    <feComposite operator="over" in="shadow" in2="SourceGraphic"/>
                </filter>
                
                <!-- Body Metallic Gradient - Darker edges, lighter center -->
                <radialGradient id="bodyMetal" cx="50%" cy="40%" r="70%">
                    <stop offset="0%" style="stop-color:#58585c"/>
                    <stop offset="40%" style="stop-color:#4a4a4e"/>
                    <stop offset="70%" style="stop-color:#3a3a3e"/>
                    <stop offset="100%" style="stop-color:#2a2a2e"/>
                </radialGradient>
                
                <!-- Hood Gradient - Arched appearance -->
                <linearGradient id="hoodGrad" x1="50%" y1="0%" x2="50%" y2="100%">
                    <stop offset="0%" style="stop-color:#6a6a6e"/>
                    <stop offset="30%" style="stop-color:#525256"/>
                    <stop offset="60%" style="stop-color:#424246"/>
                    <stop offset="100%" style="stop-color:#3a3a3e"/>
                </linearGradient>
                
                <!-- Roof Gradient -->
                <linearGradient id="roofGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" style="stop-color:#b0b0b4"/>
                    <stop offset="50%" style="stop-color:#98989c"/>
                    <stop offset="100%" style="stop-color:#808084"/>
                </linearGradient>
                
                <!-- Gold Trim Gradient -->
                <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" style="stop-color:#b8956a"/>
                    <stop offset="50%" style="stop-color:#e8d5a8"/>
                    <stop offset="100%" style="stop-color:#b8956a"/>
                </linearGradient>
                
                <!-- Chrome Gradient -->
                <linearGradient id="chromeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" style="stop-color:#999"/>
                    <stop offset="50%" style="stop-color:#fff"/>
                    <stop offset="100%" style="stop-color:#999"/>
                </linearGradient>
                
                <!-- Glass Gradient -->
                <linearGradient id="glassGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" style="stop-color:#1e1e22"/>
                    <stop offset="50%" style="stop-color:#121216"/>
                    <stop offset="100%" style="stop-color:#0a0a0e"/>
                </linearGradient>
                
                <!-- Side Highlight -->
                <linearGradient id="sideLight" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" style="stop-color:rgba(255,255,255,0)"/>
                    <stop offset="20%" style="stop-color:rgba(255,255,255,0.15)"/>
                    <stop offset="50%" style="stop-color:rgba(255,255,255,0)"/>
                    <stop offset="80%" style="stop-color:rgba(255,255,255,0.15)"/>
                    <stop offset="100%" style="stop-color:rgba(255,255,255,0)"/>
                </linearGradient>
            </defs>
            
            <!-- Main SUV Group -->
            <g filter="url(#shadow3d)">
                <!-- Outer Body Shell -->
                <path d="M 100,50 
                         C 300,-5 300,-5 500,50
                         C 540,200 540,700 500,850
                         C 300,905 300,905 100,850
                         C 60,700 60,200 100,50 Z" 
                      fill="url(#bodyMetal)" stroke="#222" stroke-width="2"/>
                
                <!-- Side 3D Light Effect -->
                <path d="M 100,50 
                         C 300,-5 300,-5 500,50
                         C 540,200 540,700 500,850
                         C 300,905 300,905 100,850
                         C 60,700 60,200 100,50 Z" 
                      fill="url(#sideLight)" pointer-events="none"/>
                
                <!-- Hood Section - Arched Top -->
                <path d="M 115,60
                         C 300,15 300,15 485,60
                         C 490,100 490,100 480,130
                         C 300,110 300,110 120,130
                         C 110,100 110,100 115,60 Z"
                      fill="url(#hoodGrad)"/>
                
                <!-- Hood Highlight -->
                <ellipse cx="300" cy="80" rx="140" ry="30" 
                         fill="rgba(255,255,255,0.15)"/>
                
                <!-- Trunk Section -->
                <path d="M 120,770
                         C 300,790 300,790 480,770
                         C 490,810 490,810 485,840
                         C 300,885 300,885 115,840
                         C 110,810 110,810 120,770 Z"
                      fill="#3a3a3e"/>
                
                <!-- Trunk Highlight -->
                <ellipse cx="300" cy="820" rx="130" ry="25" 
                         fill="rgba(255,255,255,0.1)"/>
                
                <!-- ROOF PANEL - Main metallic surface -->
                <path d="M 140,160
                         C 300,130 300,130 460,160
                         C 470,450 470,650 460,740
                         C 300,770 300,770 140,740
                         C 130,650 130,450 140,160 Z"
                      fill="url(#roofGrad)" stroke="#666" stroke-width="1"/>
                
                <!-- Roof 3D Sheen -->
                <ellipse cx="300" cy="450" rx="130" ry="280" 
                         fill="rgba(255,255,255,0.2)"/>
                
                <!-- Sunroof -->
                <rect x="250" y="380" width="100" height="140" rx="10" 
                      fill="#6a6a6e" stroke="#555" stroke-width="1"/>
                
                <!-- Roof Grooves -->
                <g stroke="rgba(100,100,104,0.4)" stroke-width="1.5">
                    <line x1="175" y1="220" x2="175" y2="680"/>
                    <line x1="205" y1="200" x2="205" y2="700"/>
                    <line x1="235" y1="190" x2="235" y2="710"/>
                    <line x1="300" y1="185" x2="300" y2="715"/>
                    <line x1="365" y1="190" x2="365" y2="710"/>
                    <line x1="395" y1="200" x2="395" y2="700"/>
                    <line x1="425" y1="220" x2="425" y2="680"/>
                </g>
                
                <!-- Center Line -->
                <line x1="300" y1="175" x2="300" y2="725" 
                      stroke="#777" stroke-width="2"/>
                
                <!-- FRONT WINDSHIELD -->
                <path d="M 135,145
                         C 300,120 300,120 465,145
                         C 462,165 462,165 460,160
                         C 300,135 300,135 140,160
                         C 138,165 138,165 135,145 Z"
                      fill="url(#glassGrad)"/>
                
                <!-- Windshield wiper reflection -->
                <path d="M 170,140 Q 300,125 430,140" 
                      stroke="rgba(255,255,255,0.2)" stroke-width="2" fill="none"/>
                
                <!-- REAR WINDOW -->
                <path d="M 140,740
                         C 300,765 300,765 460,740
                         C 462,760 462,760 465,775
                         C 300,805 300,805 135,775
                         C 138,760 138,760 140,740 Z"
                      fill="url(#glassGrad)"/>
                
                <!-- Side Windows - Small Dark Areas -->
                <g fill="url(#glassGrad)">
                    <!-- Left Front -->
                    <path d="M 122,210 C 132,205 132,205 142,210
                             C 138,320 138,320 122,340
                             C 118,280 118,280 122,210 Z"/>
                    <!-- Left Rear -->
                    <path d="M 122,560 C 138,580 138,580 142,690
                             C 132,695 132,695 122,690
                             C 118,630 118,630 122,560 Z"/>
                    <!-- Right Front -->
                    <path d="M 458,210 C 468,205 468,205 478,210
                             C 482,280 482,280 478,340
                             C 462,320 462,320 458,210 Z"/>
                    <!-- Right Rear -->
                    <path d="M 458,690 C 468,695 468,695 478,690
                             C 482,630 482,630 478,560
                             C 462,580 462,580 458,690 Z"/>
                </g>
                
                <!-- GOLD TRIM - Outer Thick Lines -->
                <path d="M 130,230 L 130,670" 
                      stroke="url(#goldGrad)" stroke-width="6" stroke-linecap="round"/>
                <path d="M 470,230 L 470,670" 
                      stroke="url(#goldGrad)" stroke-width="6" stroke-linecap="round"/>
                
                <!-- GOLD TRIM - Inner Lines -->
                <path d="M 155,245 L 155,655" 
                      stroke="#e8d5a8" stroke-width="2.5" stroke-linecap="round"/>
                <path d="M 445,245 L 445,655" 
                      stroke="#e8d5a8" stroke-width="2.5" stroke-linecap="round"/>
                
                <!-- Side Mirrors -->
                <g fill="#3a3a3e" stroke="url(#goldGrad)" stroke-width="2">
                    <!-- Left -->
                    <path d="M 75,400 C 110,380 110,380 120,400
                             C 115,445 115,445 80,455
                             C 70,430 70,430 75,400 Z"/>
                    <!-- Right -->
                    <path d="M 480,400 C 490,380 490,380 525,400
                             C 530,430 530,430 520,455
                             C 485,445 485,445 480,400 Z"/>
                </g>
                
                <!-- Mirror Gold Accent -->
                <circle cx="85" cy="415" r="8" fill="none" stroke="#d4af37" stroke-width="1.5"/>
                <circle cx="515" cy="415" r="8" fill="none" stroke="#d4af37" stroke-width="1.5"/>
                
                <!-- Headlights -->
                <ellipse cx="130" cy="70" rx="22" ry="12" fill="rgba(255,255,255,0.25)"/>
                <ellipse cx="470" cy="70" rx="22" ry="12" fill="rgba(255,255,255,0.25)"/>
                <rect x="125" y="75" width="12" height="6" fill="#fff" rx="2"/>
                <rect x="463" y="75" width="12" height="6" fill="#fff" rx="2"/>
                
                <!-- Headlight glow -->
                <circle cx="130" cy="72" r="15" fill="rgba(255,255,255,0.1)"/>
                <circle cx="470" cy="72" r="15" fill="rgba(255,255,255,0.1)"/>
                
                <!-- Taillights -->
                <ellipse cx="130" cy="830" rx="20" ry="11" fill="rgba(200,60,60,0.6)"/>
                <ellipse cx="470" cy="830" rx="20" ry="11" fill="rgba(200,60,60,0.6)"/>
                <rect x="125" y="833" width="10" height="6" fill="#c84040" rx="2"/>
                <rect cx="463" y="833" width="10" height="6" fill="#c84040" rx="2"/>
                
                <!-- Chrome Front Strip -->
                <path d="M 155,140 Q 300,115 445,140" 
                      stroke="url(#chromeGrad)" stroke-width="4" fill="none"/>
                
                <!-- Chrome Rear Strip -->
                <path d="M 155,760 Q 300,785 445,760" 
                      stroke="url(#chromeGrad)" stroke-width="4" fill="none"/>
                
                <!-- Bottom Gold Accent Strip -->
                <path d="M 160,815 Q 300,840 440,815" 
                      stroke="url(#goldGrad)" stroke-width="3" fill="none"/>
                
            </g>
            
            <!-- 3D Shadow under car -->
            <ellipse cx="300" cy="880" rx="220" ry="30" 
                     fill="rgba(0,0,0,0.25)" filter="blur(10px)"/>
        </svg>
    </div>
</body>
</html>
